extensions:
  health_check:
  oauth2client:
    client_id: ${env:ENTRA_CLIENT_ID}
    client_secret: ${env:ENTRA_CLIENT_SECRET}
    token_url: https://login.microsoftonline.com/${env:ENTRA_TENANT_ID}/oauth2/v2.0/token
    scopes:
      - ${env:ENTRA_CLIENT_ID}/.default

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # Homelab ingest — OAuth (Entra client-credentials), via Cloudflare tunnel -> Traefik.
  otlphttp/remote:
    # NO port suffix. Cloudflare's proxied edge only serves HTTPS on
    # 443/2053/2083/2087/2096/8443 -- 4318 is not among them. The retired Azure VM
    # (otel.andrewfaust.com) listened on :4318 directly, hence the old ${env:SERVER_URL}:4318.
    endpoint: ${env:SERVER_URL}
    auth:
      authenticator: oauth2client

  debug:
    verbosity: basic

processors:
  batch:

# Homelab fan-out (extra exporter + the Bitburner :4319 receiver) lives in the
# otel-collector-config.homelab.yaml overlay, applied only on machines whose .env
# sets HOMELAB_URL. See docker-compose.homelab.yaml.
service:
  extensions: [health_check, oauth2client]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/remote]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/remote]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/remote]
